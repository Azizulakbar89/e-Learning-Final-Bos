name: Auto Tag on Push to Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'

jobs:
  auto-tag:
    name: Create Version Tag from pubspec.yaml
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from pubspec.yaml
        id: pubspec
        run: |
          # Extract version name (before the +)
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | xargs)
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2 | xargs)
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (build $BUILD), tag: $TAG"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.pubspec.outputs.tag }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist, will create it."
          fi

      - name: Configure Git
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.pubspec.outputs.tag }}"
          VERSION="${{ steps.pubspec.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG: Auto-tagged from pubspec.yaml v$VERSION"
          git push origin "$TAG"
          echo "Successfully created and pushed tag: $TAG"
