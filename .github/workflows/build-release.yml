name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Flutter APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Extract Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | xargs)
            TAG="v${VERSION}"
          fi
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (build code: $BUILD) from tag/ref: $TAG"

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build }}"

      - name: Rename APK with version
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/elearning-spemdalas-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "e-Learning Spemdalas ${{ steps.version.outputs.tag }}"
          body: |
            ## 📱 e-Learning Spemdalas ${{ steps.version.outputs.tag }}

            ### ✨ Fitur yang Diperbarui
            - 🏅 **Popup Share Lencana Baru** — Siswa mendapat popup otomatis saat membuka profil jika ada badge baru. Card lencana bisa dibagikan ke Instagram & WhatsApp. Jika dibatalkan, tidak muncul lagi.
            - 🔄 **Fix Update In-App** — Download APK langsung dari GitHub (follow redirect otomatis), popup update muncul kembali saat app dibuka dari background, dan reset 24 jam setelah dismiss.
            - 💬 **Perbaikan Chat** — Nama partner chat sudah benar (bukan nama sendiri), input pesan tidak tertutup navbar HP, hapus grup sinkron di semua tab.
            - 🔔 **Notifikasi** — Notif saat siswa kumpulkan tugas dan guru berikan nilai.
            - 🔥 **Streak Share** — Share pencapaian streak per 10 hari ke Instagram/WhatsApp.
            - 🚀 **CI/CD Auto Release** — Push ke main otomatis build APK, buat GitHub Release, dan update Firestore.

            ### 📥 Cara Install / Update
            1. Download file APK di bawah ini
            2. Buka file APK di perangkat Android kamu
            3. Izinkan instalasi dari sumber tidak dikenal jika diminta
            4. Selesai! Aplikasi siap digunakan

            ---
            *Release otomatis dibuat oleh GitHub Actions*
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/elearning-spemdalas-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy & Sync Version to Firestore
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "Menulis service account Firebase dari GitHub Secrets..."
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > assets/service-account.json
            dart tool/update_firestore_version.dart
          else
            echo "Catatan: FIREBASE_SERVICE_ACCOUNT belum diset di GitHub Secrets repository."
          fi

      - name: Deploy Firebase Rules (Optional if FIREBASE_TOKEN set)
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules,storage:rules --token "$FIREBASE_TOKEN" || true
